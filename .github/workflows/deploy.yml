name: Deploy

# Triggers the Coolify deployment of main once both required checks have
# passed for the same commit. Without the two secrets below it does nothing,
# so the template deploys nowhere until a project configures it.
# See docs/architecture/deployment.md.

on:
  workflow_run:
    workflows: [Verify, E2E]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Trigger Coolify
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Check that both required checks passed for this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ready=true
          for workflow in verify.yml e2e.yml; do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$SHA" --json conclusion --jq '.[0].conclusion // "pending"')
            echo "$workflow: $conclusion"
            [ "$conclusion" = "success" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Trigger the deployment
        if: steps.gate.outputs.ready == 'true'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK_URL and COOLIFY_TOKEN are not set, so nothing is deployed."
            exit 0
          fi
          curl --fail --silent --show-error "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
          echo "Deployment triggered."
