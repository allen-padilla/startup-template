services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup
      POSTGRES_DB: startup
    ports:
      - "5432:5432"
    volumes:
      - startup_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup -d startup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  startup_postgres_data: